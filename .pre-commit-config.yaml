repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Parallel `terraform init` races on TF_PLUGIN_CACHE_DIR in CI
        # (hashicorp/terraform#31964).
        args:
          - --hook-config=--parallelism-limit=1
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-metaschema
        files: ^modules/status/lambda/status_(payload|series)\.schema\.json$
      - id: check-jsonschema
        files: ^build/web/tests/fixtures/.*\.json$
        exclude: ^build/web/tests/fixtures/series/
        args: [--schemafile, modules/status/lambda/status_payload.schema.json]
      # The series schema has no $id so its relative $refs resolve against
      # its own path.
      - id: check-jsonschema
        files: ^build/web/tests/fixtures/series/.*\.json$
        args: [--schemafile, modules/status/lambda/status_series.schema.json]

  - repo: local
    hooks:
      - id: hygiene
        name: hygiene
        entry: sh scripts/hygiene.sh
        language: system
        exclude: ^(LICENSE|build/web/package-lock\.json)$
