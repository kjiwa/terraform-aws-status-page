name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: install shellcheck
        run: python3 -m pip install shellcheck-py==0.11.0.1
      - name: shellcheck
        run: find . -name '*.sh' -not -path './.terraform/*' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck -x

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hygiene
        run: git ls-files -z -- . ':!LICENSE' | xargs -0 sh scripts/hygiene.sh
