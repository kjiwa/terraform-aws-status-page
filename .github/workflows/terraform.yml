name: terraform

on:
  pull_request:
    paths:
      - 'modules/**'
      - '.tflint.hcl'
      - '.terraform-version'
      - '.pre-commit-config.yaml'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - '.tflint.hcl'
      - '.terraform-version'
      - '.pre-commit-config.yaml'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: tfver
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.64.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-
      - name: tflint init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: fmt, validate, tflint, test
        run: |
          terraform fmt -check -recursive
          for module in modules/*/; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir "$module"
            terraform -chdir="$module" test
          done
