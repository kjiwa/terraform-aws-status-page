name: python

on:
  pull_request:
    paths:
      - 'modules/*/lambda/**'
      - 'build/web/tests/fixtures/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'modules/*/lambda/**'
      - 'build/web/tests/fixtures/**'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Matches the Lambdas' declared runtime.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
