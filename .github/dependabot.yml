version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /modules/availability
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /modules/status
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /build/web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint peers typescript ">=4.8.4 <6.1.0"; a TS major breaks
    # `npm ci` for every package in the group, not just typescript.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
