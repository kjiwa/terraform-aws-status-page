[tool.pytest.ini_options]
testpaths = [
  "modules/status/lambda",
  "modules/availability/lambda",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  # The Lambdas deliberately catch Exception per AWS call / per status panel,
  # so one dependency's failure degrades that one field instead of sinking the
  # whole response.
  "BLE001",
  "TRY002",
]
